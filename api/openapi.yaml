openapi: 3.0.3
info:
  title: GEL e2e probe API
  version: "2.0"
paths:
  /users:
    get:
      parameters:
        - name: tenant
          in: query
          required: true
          schema: { type: string }
      responses:
        "400":
          description: Bad request
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, name] }
      responses:
        "201":
          description: Created
