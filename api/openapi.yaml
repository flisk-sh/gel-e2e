openapi: 3.0.3
info:
  title: GEL e2e probe API
  version: "1.0"
paths:
  /users:
    get:
      responses:
        "200":
          description: List users
    post:
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Created
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One user
