# Shared Flisk CI from flisk-sh/.github: CodeQL.
name: Flisk CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # weekly CodeQL, so new vulnerability queries reach code that has not changed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flisk-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    uses: flisk-sh/.github/.github/workflows/ci.yml@c24839adc12bb5043d9cb4fd28276e7214899c19 # ci/lanes test

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: flisk-sh/.github/.github/workflows/codeql.yml@c24839adc12bb5043d9cb4fd28276e7214899c19 # ci/lanes test
